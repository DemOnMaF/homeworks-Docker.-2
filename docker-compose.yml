name: FedorovDN-monitoring

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: FedorovDN-netology-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - my-netology-hw

  pushgateway:
    image: prom/pushgateway:latest
    container_name: FedorovDN-netology-pushgateway
    ports:
      - "9091:9091"
    networks:
      - my-netology-hw

  grafana:
    image: grafana/grafana:latest
    container_name: FedorovDN-netology-grafana
    volumes:
      - ./grafana/custom.ini:/etc/grafana/grafana.ini:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_PATHS_CONFIG=/etc/grafana/grafana.ini
    ports:
      - "80:3000"
    networks:
      - my-netology-hw

volumes:
  prometheus_data:
  grafana_data:

networks:
  my-netology-hw:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16
    name: FedorovDN-my-netology-hw
